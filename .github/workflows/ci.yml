name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium (for browser/WebGL tests)
        run: pnpm exec playwright install --with-deps chromium

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # The playgrounds are not part of `pnpm -r build` (they're private apps with
      # a build:site script), so this is what catches a broken demo on a PR rather
      # than in the image build below, which only runs on main.
      - name: Build playground site
        run: pnpm build:playground

  # Build the playground image (demo.fftvisualizer.com), smoke-test that it boots
  # and serves, then push to the self-hosted registry. Only on main, after CI passes.
  build-push-demo:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      IMAGE: registry.apps.vernaillen.dev/demo-fftvisualizer-com
      # Not a secret: the endpoint is useless without COOLIFY_TOKEN. Keeping it here
      # means REGISTRY_USERNAME / REGISTRY_PASSWORD / COOLIFY_TOKEN can all live as
      # harmonics-audio org secrets, with nothing to configure per repo.
      COOLIFY_DEPLOY_URL: https://coolify.apps.vernaillen.dev/api/v1/deploy?uuid=uy17autwbm5dgmadwwdtpoj4&force=false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to the registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: registry.apps.vernaillen.dev
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # load: true keeps the image local so we can smoke-test it before pushing
      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (boot the image, assert it serves and reports healthy)
        run: |
          docker run -d --name smoke -p 8080:8080 "${IMAGE}:${{ github.sha }}"

          serving=0
          health=starting
          for i in $(seq 1 60); do
            if [ "$serving" = 0 ] && curl -fsS -o /dev/null http://localhost:8080/; then serving=1; fi
            health=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' smoke)
            if [ "$serving" = 1 ] && [ "$health" != starting ]; then break; fi
            sleep 1
          done

          echo "serving=$serving health=$health"

          # Each app is only reachable from the others' switcher bar, so nothing
          # else would notice an assembly step that silently dropped one. Probed
          # here, while the container is still up; asserted after the teardown below.
          missing=
          if [ "$serving" = 1 ]; then
            for path in /core/ /vue/ /react/ /nuxt/; do
              curl -fsS -o /dev/null "http://localhost:8080$path" || missing="$missing $path"
            done
          fi

          # / is the site's front door and holds no page of its own — it must
          # redirect to the core playground. The probe above only proves the root
          # answers *something*; curl treats a 302 as success, and so would a 200
          # from a stray index.html that shouldn't be there.
          root_redirect=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' http://localhost:8080/)
          echo "root_redirect=$root_redirect"

          # Radio is the playgrounds' default source, so a broken /api/radio is a
          # broken demo. Sent with the headers a real listener sends: SomaFM
          # hotlink-blocks a browser User-Agent or any Referer, and nginx forwards
          # both unless told otherwise — which is exactly how this once shipped broken.
          # curl exits 28 when --max-time cuts the endless stream, hence `|| true`.
          : > radio.bin   # curl leaves it untouched if it never connects, so start empty
          radio=$(curl -s -o radio.bin -w '%{http_code}' --max-time 10 \
            -H 'Referer: http://localhost:8080/vue/' \
            -H 'Range: bytes=0-' \
            -H 'User-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36' \
            http://localhost:8080/api/radio || true)
          radio_bytes=$(wc -c < radio.bin | tr -d ' ')
          echo "radio=$radio bytes=$radio_bytes"

          echo "----- container logs -----"; docker logs smoke || true
          echo "----- healthcheck log -----"
          docker inspect -f '{{if .State.Health}}{{range .State.Health.Log}}exit={{.ExitCode}} {{printf "%q" .Output}}{{"\n"}}{{end}}{{end}}' smoke || true
          docker rm -f smoke >/dev/null 2>&1 || true

          [ "$serving" = 1 ] || { echo "::error::Smoke test failed — image did not serve on :8080"; exit 1; }
          [ -z "$missing" ] || { echo "::error::Smoke test failed — not served:$missing"; exit 1; }

          case "$root_redirect" in
            "302 http://localhost:8080/core/") ;;
            *) echo "::error::Smoke test failed — / should 302 to /core/, got '$root_redirect'"; exit 1 ;;
          esac

          # A 403 means our own proxy headers are wrong and the demo is broken; an
          # upstream outage is SomaFM's problem, not a reason to block a deploy that
          # may not even touch the radio. Only the former fails the build.
          case "$radio" in
            403|404)
              echo "::error::Smoke test failed — /api/radio returned $radio (proxy headers rejected upstream)"; exit 1 ;;
            200)
              [ "$radio_bytes" -gt 0 ] \
                || { echo "::error::Smoke test failed — /api/radio returned 200 with an empty body"; exit 1; } ;;
            *)
              echo "::warning::/api/radio returned '$radio' — treating as a SomaFM outage, not a config error" ;;
          esac

          # The in-image HEALTHCHECK runs *inside* the container, so it catches bind-address
          # and localhost/IPv6 mistakes that a published-port curl from the runner cannot.
          # Coolify gates its proxy switchover on this, so an unhealthy image never goes live.
          [ "$health" = healthy ] || { echo "::error::Smoke test failed — container health is '$health', expected healthy"; exit 1; }

      - name: Push image
        run: |
          docker push "${IMAGE}:latest"
          docker push "${IMAGE}:${{ github.sha }}"

      # Coolify pulls :latest but won't redeploy on its own — hit its deploy API so
      # the new image goes live. The endpoint must be reachable from GitHub-hosted runners.
      - name: Trigger Coolify redeploy
        run: |
          curl --fail-with-body -sS "$COOLIFY_DEPLOY_URL" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"
