# The assembled playground site, replacing the base image's
# /etc/nginx/conf.d/default.conf (see the repo Dockerfile).
#
# Two jobs: serve the four static playgrounds, and answer /api/radio. Under
# `pnpm dev` and `pnpm preview` that same path is served by a Vite plugin
# instead — both hosts are thin wrappers over one implementation in
# playground/shared/radioStream.ts. Keep the upstream URL below in sync with
# RADIO_UPSTREAM_URL there.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The site has no landing page: the front door is the core playground, and the
    # switcher bar in each app is what gets you to the other three. Exact match, so
    # it takes priority over `index` without affecting /core/, /vue/, /react/, /nuxt/.
    #
    # Relative Location, because nginx builds an absolute one from its *listen*
    # port and the client's scheme — behind Coolify's TLS proxy that turns a hit on
    # https://demo.fftvisualizer.com/ into http://demo.fftvisualizer.com:8080/core/,
    # wrong scheme and a port that isn't published. A relative redirect leaves both
    # to the browser, which already knows how it reached us.
    absolute_redirect off;
    location = / {
        return 302 /core/;
    }

    # Why the radio stream is proxied rather than played directly: SomaFM
    # hotlink-protects it by User-Agent — Chrome's gets 403, Safari's gets a 302 —
    # and a page cannot change the User-Agent its own <audio> element sends. So
    # the request is remade here with a neutral one. That is the *only* reason;
    # the upstream ignores Range and sends `access-control-allow-origin: *`.
    location = /api/radio {
        # A literal hostname in proxy_pass is resolved once, when the config
        # loads, and cached for the life of the process. Going through a variable
        # defers resolution to request time, which is what needs the resolver.
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        set $soma_stream https://ice2.somafm.com/gsclassic-128-mp3;

        proxy_pass $soma_stream;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;   # SNI: the CDN host serves several names
        proxy_set_header Accept-Encoding "";

        # The two load-bearing lines, and the reason this proxy exists at all.
        # SomaFM 403s on either signal independently, and nginx forwards every
        # client header it isn't told to replace — so without these it hands over
        # the listener's own Chrome User-Agent and the playground page as Referer,
        # and gets the exact 403 the proxy is here to avoid. The Node hosts need
        # neither: `fetch` sends no Referer and we set the User-Agent there too.
        # Keep in sync with RADIO_USER_AGENT in playground/shared/radioStream.ts.
        proxy_set_header User-Agent "fft-visualizer-playground/1.0 (+https://github.com/harmonics-audio/fft-visualizer)";
        proxy_set_header Referer "";

        # The response never ends, so it has to be piped: buffering would grow
        # memory without bound and hold the first byte back until a buffer filled.
        proxy_buffering off;
        add_header Cache-Control no-store always;
    }

    # Every bundle filename is content-hashed, so they can be cached forever…
    location ~* \.(js|css|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # …but the documents that reference them must not be, or a deploy leaves
    # browsers running the previous bundle.
    location ~* \.html$ {
        add_header Cache-Control "no-cache" always;
    }
}
